# Runs the theme tests on every push. Releases are built, signed and notarized on a Mac, then
# attached to a GitHub release as BrightMeUp.dmg and BrightMeUp.zip.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: tests/run.sh
